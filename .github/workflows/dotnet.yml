name: .NET and Docker CI

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./server/SolarWatchAPI
      
    - name: Build API
      run: dotnet build --no-restore
      working-directory: ./server/SolarWatchAPI

    - name: Test API
      run: dotnet test --no-build --verbosity normal
      working-directory: ./server/SolarWatchAPI

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build API Docker image
      run: |
        docker build -t api-solar-watch-app:latest ./SolarWatchAPI
        docker tag api-solar-watch-app:latest ${{ secrets.DOCKER_USERNAME }}/api-solar-watch-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/api-solar-watch-app:latest
        
    - name: Build Client Docker image
      run: |
        docker build -t client-solar-watch-app:latest ./client
        docker tag client-solar-watch-app:latest ${{ secrets.DOCKER_USERNAME }}/client-solar-watch-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/client-solar-watch-app:latest
